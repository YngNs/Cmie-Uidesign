<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>电机试验分析软件 UI 概念方案 - Kimi K3</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:var(--text);background:var(--bg);letter-spacing:0;-webkit-font-smoothing:antialiased}
    button{font:inherit;cursor:pointer}
    table{width:100%;border-collapse:collapse;font-size:12px}
    .app{width:100vw;height:100vh;display:grid;background:var(--bg)}
    .num{font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
    .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.3px}
    .dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;flex-shrink:0}
    .good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)} .accent{color:var(--accent)} .muted{color:var(--muted)}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
    .panel-title{height:36px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;flex-shrink:0}
    .panel-title small{font-weight:400;color:var(--muted);font-size:10px}
    .panel-body{flex:1;min-height:0;overflow:hidden}
    .icon-btn{height:32px;padding:0 12px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:5px;display:inline-flex;align-items:center;gap:6px;font-size:11px}
    .action{height:32px;padding:0 14px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600}
    .action.primary{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
    .action.ghost{background:transparent}
    .metric{padding:10px 14px;display:flex;flex-direction:column;justify-content:center;min-width:0}
    .metric-label{font-size:10px;color:var(--muted);margin-bottom:4px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
    .metric-value{font-size:22px;font-weight:700;line-height:1.1}
    .metric-unit{font-size:10px;color:var(--muted);margin-left:3px;font-weight:500}
    .metric-delta{font-size:10px;margin-top:3px}
    .scheme-label{position:fixed;right:22px;bottom:18px;z-index:20;background:rgba(15,23,42,.92);color:#fff;padding:8px 14px;border-radius:4px;font-size:11px;letter-spacing:0;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.3)}
    .scheme-switch{position:fixed;right:14px;top:50%;z-index:30;transform:translateY(-50%);display:grid;gap:4px;padding:6px;background:rgba(15,23,42,.88);border:1px solid rgba(255,255,255,.16);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.32);backdrop-filter:blur(8px)}
    .scheme-switch button{width:36px;height:36px;border:1px solid rgba(255,255,255,.18);border-radius:5px;background:transparent;color:#cbd5e1;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
    .scheme-switch button:hover{background:rgba(255,255,255,.12);color:#fff}
    .scheme-switch button.active{background:#fff;color:#17202a;border-color:#fff}

    /* ============== Scheme A: Industrial Command Center (dark amber) ============== */
    body.scheme-a{--bg:#0e1418;--panel:#161d22;--subtle:#1d262c;--text:#e6edf0;--muted:#7a8b92;--line:#2a363d;--accent:#f0a51a;--onAccent:#1a1305;--good:#3ecf8e;--warn:#f0a51a;--bad:#f35b62;--selected:#2a261d;--radius:4px}
    .scheme-a .app{grid-template-columns:240px 1fr;grid-template-rows:64px 1fr 38px}
    .scheme-a header{grid-column:1/3;display:flex;align-items:center;padding:0 18px;background:linear-gradient(180deg,#1a2126 0%,#141a1e 100%);border-bottom:1px solid var(--line)}
    .scheme-a .brand{display:flex;align-items:center;gap:11px;font-weight:700}
    .scheme-a .brand-mark{width:34px;height:34px;display:grid;place-items:center;background:linear-gradient(135deg,#f0a51a,#c47a13);color:#1a1305;border-radius:6px;font-size:18px;font-weight:800}
    .scheme-a .head-title{margin-left:32px}
    .scheme-a .head-title strong{font-size:14px;display:block}
    .scheme-a .head-title small{display:block;color:var(--muted);font-size:10px;margin-top:2px;font-family:Consolas,monospace}
    .scheme-a .head-strip{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:11px}
    .scheme-a .head-strip .item{display:flex;align-items:center;gap:5px;color:var(--muted)}
    .scheme-a .head-strip .item strong{color:var(--text);font-family:Consolas,monospace}
    .scheme-a aside{background:#0a0e11;border-right:1px solid var(--line);grid-row:2/4;padding:14px 10px;overflow:hidden}
    .scheme-a aside .nav-section{font-size:10px;color:#5b6e76;font-weight:700;padding:14px 11px 7px;letter-spacing:1px;text-transform:uppercase}
    .scheme-a aside .nav-item{height:38px;padding:0 11px;display:flex;align-items:center;gap:10px;border-radius:4px;color:#9aacb3;font-size:12px;margin:2px 0;cursor:pointer}
    .scheme-a aside .nav-item.active{background:linear-gradient(90deg,#3a2a10 0%,#1d1812 100%);color:#f0a51a;font-weight:700;border-left:2px solid #f0a51a;padding-left:9px}
    .scheme-a aside .nav-icon{width:18px;text-align:center;font-size:14px}
    .scheme-a aside .nav-count{margin-left:auto;font-size:10px;background:#1f2930;padding:2px 6px;border-radius:3px;color:#9aacb3}
    .scheme-a main{padding:14px;display:grid;grid-template-rows:90px 1fr 220px;gap:12px;min-height:0;min-width:0}
    .scheme-a .kpi-row{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
    .scheme-a .kpi-row .panel{padding:0}
    .scheme-a .kpi-row .metric{padding:14px 16px;position:relative}
    .scheme-a .kpi-row .metric::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:3px 0 0 3px}
    .scheme-a .kpi-row .metric.warn::before{background:var(--warn)}
    .scheme-a .kpi-row .metric.good::before{background:var(--good)}
    .scheme-a .kpi-row .metric.bad::before{background:var(--bad)}
    .scheme-a .kpi-row .metric-value{font-size:24px}
    .scheme-a .middle{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:12px;min-height:0}
    .scheme-a .middle .panel{overflow:hidden}
    .scheme-a .test-list{padding:6px 0;overflow:auto}
    .scheme-a .test-group{padding:8px 14px 4px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
    .scheme-a .test-item{height:32px;padding:0 14px;display:flex;align-items:center;gap:8px;font-size:12px;color:#9aacb3;border-left:2px solid transparent}
    .scheme-a .test-item.active{background:#1f1812;color:#f0a51a;font-weight:600;border-left-color:#f0a51a}
    .scheme-a .test-item.done{color:#5b6e76}
    .scheme-a .test-item .check{margin-left:auto;font-size:11px}
    .scheme-a .test-item .check.done{color:#3ecf8e}
    .scheme-a .test-item .check.doing{color:#f0a51a}
    .scheme-a .chart-wrap{position:relative;flex:1;min-height:0}
    .scheme-a .chart-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
    .scheme-a .chart-legend{position:absolute;top:8px;right:12px;display:flex;gap:14px;font-size:10px;color:var(--muted)}
    .scheme-a .chart-legend i{display:inline-block;width:18px;height:2px;margin-right:5px;vertical-align:middle}
    .scheme-a .dev-grid{padding:10px 14px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
    .scheme-a .dev-card{padding:9px 11px;background:#0f1518;border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;gap:8px;font-size:11px}
    .scheme-a .dev-card .dot{width:8px;height:8px}
    .scheme-a .dev-card .name{font-weight:600;color:var(--text)}
    .scheme-a .dev-card .meta{color:var(--muted);font-size:10px;margin-left:auto}
    .scheme-a .dev-card.warn{border-color:#5c4a1a;background:#1d1812}
    .scheme-a .dev-card.bad{border-color:#5c2a2d;background:#1d1517}
    .scheme-a .bottom-row{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;min-height:0}
    .scheme-a .bottom-row .panel{overflow:hidden}
    .scheme-a .alarm-list{padding:4px 14px;overflow:auto;font-family:Consolas,monospace}
    .scheme-a .alarm{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:11px}
    .scheme-a .alarm time{color:var(--muted);font-size:10px}
    .scheme-a footer{grid-column:2;display:flex;align-items:center;padding:0 14px;background:#0a0e11;border-top:1px solid var(--line);gap:16px;font-size:11px}
    .scheme-a footer .right{margin-left:auto;display:flex;align-items:center;gap:14px}
    .scheme-a .device{display:flex;align-items:center;gap:6px;color:var(--muted)}
    .scheme-a .device strong{color:var(--text)}

    /* ============== Scheme B: Minimalist Whiteboard (light) ============== */
    body.scheme-b{--bg:#fafbfc;--panel:#ffffff;--subtle:#f3f6f8;--text:#1a2330;--muted:#6b7a85;--line:#e3e8ed;--accent:#2b6cff;--onAccent:#fff;--good:#18a957;--warn:#e08a1c;--bad:#e2494b;--selected:#eaf1fe;--radius:10px}
    .scheme-b .app{grid-template-rows:68px 84px 1fr 44px}
    .scheme-b header{display:flex;align-items:center;padding:0 28px;background:#fff;border-bottom:1px solid var(--line)}
    .scheme-b .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
    .scheme-b .brand-mark{width:32px;height:32px;display:grid;place-items:center;background:linear-gradient(135deg,#2b6cff,#0e4ec7);color:#fff;border-radius:8px;font-size:16px;font-weight:800}
    .scheme-b .head-nav{display:flex;gap:24px;margin-left:42px;font-size:13px;color:var(--muted)}
    .scheme-b .head-nav .active{color:var(--accent);font-weight:700}
    .scheme-b .head-right{margin-left:auto;display:flex;align-items:center;gap:10px}
    .scheme-b .stepper{display:grid;grid-template-columns:repeat(6,1fr);padding:18px 80px;background:#fff;border-bottom:1px solid var(--line)}
    .scheme-b .step{position:relative;text-align:center;font-size:12px;color:var(--muted)}
    .scheme-b .step:before{content:"";position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--line)}
    .scheme-b .step:first-child:before{display:none}
    .scheme-b .step i{position:relative;z-index:1;margin:0 auto 7px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--subtle);font-style:normal;font-size:11px;font-weight:700;color:var(--muted)}
    .scheme-b .step.done i{background:var(--good);color:#fff}
    .scheme-b .step.current{color:var(--accent);font-weight:700}
    .scheme-b .step.current i{background:var(--accent);color:#fff;box-shadow:0 0 0 4px #dbe8fa}
    .scheme-b main{padding:18px 28px 20px;display:grid;grid-template-columns:280px 1fr 320px;gap:14px;min-height:0}
    .scheme-b .left-col{display:grid;grid-template-rows:200px minmax(0,1fr);gap:14px;min-height:0}
    .scheme-b .left-col .panel:last-child{overflow:hidden}
    .scheme-b .motor-card{padding:18px}
    .scheme-b .motor-card .label{font-size:11px;color:var(--muted);margin-bottom:4px}
    .scheme-b .motor-card .name{font-size:18px;font-weight:800;margin-bottom:4px}
    .scheme-b .motor-card .id{font-size:11px;color:var(--muted);font-family:Consolas,monospace}
    .scheme-b .motor-card .params{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}
    .scheme-b .motor-card .params .item{font-size:11px}
    .scheme-b .motor-card .params .item span{display:block;color:var(--muted);font-size:10px;margin-bottom:2px}
    .scheme-b .motor-card .params .item b{font-size:14px}
    .scheme-b .middle-col{display:grid;grid-template-rows:56px 110px 1fr 130px;gap:12px;min-height:0}
    .scheme-b .title-row{display:flex;align-items:center}
    .scheme-b .title-row h1{font-size:20px;margin:0;font-weight:800}
    .scheme-b .title-row .sub{color:var(--muted);font-size:12px;margin-top:3px;margin-left:14px}
    .scheme-b .title-row .actions{margin-left:auto;display:flex;gap:8px}
    .scheme-b .kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:0}
    .scheme-b .kpi-row .panel{padding:0;overflow:hidden}
    .scheme-b .kpi-row .metric{padding:14px 16px;border-right:1px solid var(--line)}
    .scheme-b .kpi-row .metric:last-child{border-right:0}
    .scheme-b .kpi-row .metric-value{font-size:22px}
    .scheme-b .data-panel{overflow:hidden}
    .scheme-b table th{height:34px;background:var(--subtle);text-align:left;color:var(--muted);font-weight:600;padding:0 14px;font-size:11px}
    .scheme-b table td{height:32px;padding:0 14px;border-bottom:1px solid var(--line)}
    .scheme-b table tbody tr:hover td{background:var(--subtle)}
    .scheme-b table tbody tr.selected td{background:var(--selected)}
    .scheme-b .bottom-split{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;min-height:0}
    .scheme-b .right-col{display:grid;grid-template-rows:200px 1fr 100px;gap:14px;min-height:0}
    .scheme-b .right-col .panel{overflow:hidden}
    .scheme-b .dev-list{padding:6px 14px;overflow:auto}
    .scheme-b .dev-item{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}
    .scheme-b .dev-item .name{font-weight:600}
    .scheme-b .dev-item .meta{color:var(--muted);font-size:10px;margin-left:8px}
    .scheme-b .dev-item .badge{margin-left:auto}
    .scheme-b .report-list{padding:4px 14px;overflow:auto}
    .scheme-b .report-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
    .scheme-b .report-item .icon{width:28px;height:28px;background:var(--subtle);border-radius:6px;display:grid;place-items:center;font-size:12px;color:var(--accent)}
    .scheme-b .report-item .name{font-weight:600}
    .scheme-b .report-item .meta{color:var(--muted);font-size:10px;margin-top:2px}
    .scheme-b .report-item .action{margin-left:auto;height:28px;padding:0 10px;font-size:11px}
    .scheme-b .tip{padding:14px;background:#fff8e8;border:1px solid #f1d28f;border-radius:8px;color:#775317;font-size:11px;line-height:1.7}
    .scheme-b footer{display:flex;align-items:center;padding:0 28px;background:#fff;border-top:1px solid var(--line);font-size:11px;color:var(--muted);gap:18px}
    .scheme-b footer .right{margin-left:auto;display:flex;align-items:center;gap:14px}

    /* ============== Scheme C: Cyberpunk Neon (dark neon) ============== */
    body.scheme-c{--bg:#07060f;--panel:#0e0a1d;--subtle:#15102a;--text:#e8e9ff;--muted:#7c75a8;--line:#1f1a3a;--accent:#00e5ff;--onAccent:#07060f;--good:#00ffa3;--warn:#ffb627;--bad:#ff2e7e;--selected:#1c1538;--radius:2px}
    .scheme-c{background:radial-gradient(ellipse at 20% 0%,#1a0830 0%,transparent 50%),radial-gradient(ellipse at 90% 90%,#080620 0%,transparent 50%),#07060f}
    .scheme-c .app{grid-template-columns:80px 1fr;grid-template-rows:60px 1fr 36px}
    .scheme-c header{grid-column:1/3;display:flex;align-items:center;padding:0 20px;background:rgba(15,10,29,.85);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
    .scheme-c .brand{display:flex;align-items:center;gap:11px;font-weight:700}
    .scheme-c .brand-mark{width:36px;height:36px;display:grid;place-items:center;background:linear-gradient(135deg,#00e5ff,#ff2e7e);color:#07060f;border-radius:6px;font-size:18px;font-weight:900;box-shadow:0 0 18px rgba(0,229,255,.55)}
    .scheme-c .brand-text{font-size:13px;letter-spacing:2px}
    .scheme-c .brand-text small{display:block;color:#ff2e7e;font-size:9px;letter-spacing:3px;margin-top:1px}
    .scheme-c .head-stats{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:11px;font-family:Consolas,monospace}
    .scheme-c .head-stats .stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
    .scheme-c .head-stats .stat .v{color:var(--accent);font-size:13px;font-weight:700}
    .scheme-c .head-stats .stat .l{color:var(--muted);font-size:9px;letter-spacing:1px;margin-top:2px}
    .scheme-c aside{grid-row:2/4;background:rgba(15,10,29,.7);border-right:1px solid var(--line);padding:14px 8px;display:flex;flex-direction:column;gap:6px}
    .scheme-c aside .nav-item{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;border-radius:4px;color:#7c75a8;font-size:10px;letter-spacing:1px;cursor:pointer;border:1px solid transparent}
    .scheme-c aside .nav-item .icon{font-size:20px}
    .scheme-c aside .nav-item.active{background:linear-gradient(180deg,rgba(0,229,255,.18),rgba(0,229,255,.02));color:var(--accent);border-color:rgba(0,229,255,.4);box-shadow:0 0 12px rgba(0,229,255,.3) inset,0 0 12px rgba(0,229,255,.2)}
    .scheme-c main{padding:14px;display:grid;grid-template-rows:90px 1fr 200px;gap:12px;min-height:0;min-width:0}
    .scheme-c .kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
    .scheme-c .kpi-row .panel{position:relative;background:linear-gradient(135deg,rgba(0,229,255,.05) 0%,rgba(255,46,126,.05) 100%);border:1px solid rgba(0,229,255,.3);box-shadow:0 0 14px rgba(0,229,255,.12) inset}
    .scheme-c .kpi-row .metric{padding:13px 16px;position:relative;overflow:hidden}
    .scheme-c .kpi-row .metric::after{content:"";position:absolute;top:0;right:0;width:60px;height:60px;background:radial-gradient(circle,rgba(0,229,255,.18) 0%,transparent 70%);pointer-events:none}
    .scheme-c .kpi-row .metric-label{color:#7c75a8;letter-spacing:2px;font-size:9px}
    .scheme-c .kpi-row .metric-value{color:var(--accent);font-size:24px;text-shadow:0 0 14px rgba(0,229,255,.6)}
    .scheme-c .kpi-row .metric.warn .metric-value{color:#ffb627;text-shadow:0 0 14px rgba(255,182,39,.6)}
    .scheme-c .kpi-row .metric.good .metric-value{color:#00ffa3;text-shadow:0 0 14px rgba(0,255,163,.6)}
    .scheme-c .middle{display:grid;grid-template-columns:1fr 1fr 280px;gap:12px;min-height:0}
    .scheme-c .middle .panel{border:1px solid rgba(0,229,255,.2);box-shadow:0 0 14px rgba(0,229,255,.08) inset}
    .scheme-c .panel-title{color:var(--accent);letter-spacing:1px}
    .scheme-c .panel-title small{color:#7c75a8}
    .scheme-c .chart-wrap{position:relative;flex:1;min-height:0}
    .scheme-c .chart-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
    .scheme-c .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(0,229,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.07) 1px,transparent 1px);background-size:30px 30px;pointer-events:none}
    .scheme-c .right-stack{display:grid;grid-template-rows:1fr 1fr 1fr;gap:10px;min-height:0}
    .scheme-c .radar{padding:18px;display:grid;place-items:center}
    .scheme-c .ring{width:130px;height:130px;border-radius:50%;background:conic-gradient(#00ffa3 0 72%,#00e5ff 72% 88%,#ff2e7e 88% 96%,#1f1a3a 96%);position:relative;display:grid;place-items:center;box-shadow:0 0 30px rgba(0,255,163,.4)}
    .scheme-c .ring::after{content:"94.2%";width:96px;height:96px;border-radius:50%;background:#0e0a1d;display:grid;place-items:center;font-size:24px;font-weight:800;color:#00ffa3;font-family:Consolas,monospace}
    .scheme-c .ring-label{text-align:center;margin-top:8px;font-size:11px;color:#7c75a8;letter-spacing:2px}
    .scheme-c .events{padding:8px 12px;overflow:auto}
    .scheme-c .event{display:grid;grid-template-columns:8px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:10px;font-family:Consolas,monospace}
    .scheme-c .event time{color:#7c75a8}
    .scheme-c .event.ok{color:#00ffa3}
    .scheme-c .event.warn{color:#ffb627}
    .scheme-c .event.bad{color:#ff2e7e}
    .scheme-c .bottom-row{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;min-height:0}
    .scheme-c footer{grid-column:2;display:flex;align-items:center;padding:0 16px;background:rgba(15,10,29,.85);border-top:1px solid var(--line);gap:16px;font-size:11px;font-family:Consolas,monospace}
    .scheme-c footer .right{margin-left:auto;display:flex;align-items:center;gap:14px}

    /* ============== Scheme D: Academic Lab Emerald (light) ============== */

<body>
  <div id="root"></div>
  <div class="scheme-label" id="schemeLabel"></div>
  <nav class="scheme-switch" id="schemeSwitch"></nav>
  <script id="appData"></script>
  <script>
    const schemes = [
      {key:'a', name:'方案 A · 工业指挥中心 - 实时监控聚焦', theme:'深色 + 琥珀橙', desc:'大型实时KPI矩阵 + 多设备协同监控'},
      {key:'b', name:'方案 B · 极简白板 - 流程引导聚焦', theme:'纯白 + 天空蓝', desc:'横向步骤引导 + 卡片化轻量布局'},
      {key:'c', name:'方案 C · 赛博霓虹 - 数据可视化聚焦', theme:'深紫黑 + 霓虹青/品红', desc:'HUD科幻风 + 大型数据可视化'},
      {key:'d', name:'方案 D · 实验室翡翠 - 分析计算聚焦', theme:'灰白 + 翡翠绿', desc:'学术严谨风 + 密集数据分析表'},
      {key:'e', name:'方案 E · 玻璃态渐变 - 综合工作台', theme:'暗色 + 渐变蓝紫', desc:'玻璃态卡片 + 渐变背景 + 现代材质'},
      {key:'f', name:'方案 F · 暖色高密度 - 设备通讯聚焦', theme:'暖灰 + 橙红', desc:'经典工业 + 多列密集工程界面'},
    ];
    const sw = document.getElementById('schemeSwitch');
    schemes.forEach(s => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = s.key.toUpperCase();
      b.title = s.name;
      b.dataset.scheme = s.key;
      b.addEventListener('click', () => {
        const u = new URL(location.href);
        u.searchParams.set('scheme', s.key);
        location.href = u.href;
      });
      sw.appendChild(b);
    });
    const requested = (new URLSearchParams(location.search).get('scheme') || 'a').toLowerCase();
    const key = schemes.find(s => s.key === requested) ? requested : 'a';
    document.body.className = 'scheme-' + key;
    document.querySelectorAll('.scheme-switch button').forEach(b => {
      b.classList.toggle('active', b.dataset.scheme === key);

                  <div class="item"><span class="dot warn"></span><div><div class="name">温度采集</div><div style="color:var(--muted);font-size:9px">23/24</div></div><span class="badge warn" style="font-size:9px">部分</span></div>

              <div class="panel" style="height:90px">
                <div class="panel-title">关键计算结果<small>实时</small></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;padding:6px;gap:4px;font-size:10px">
                  <div><div style="color:var(--muted);font-size:9px">空载电流 I₀</div><b class="num" style="color:#e87a3a;font-size:13px">13.8 A</b></div>
                  <div><div style="color:var(--muted);font-size:9px">空载损耗 P₀</div><b class="num" style="color:#e87a3a;font-size:13px">1.24 kW</b></div>
                  <div><div style="color:var(--muted);font-size:9px">拟合优度 R²</div><b class="num" style="color:#7ab95a;font-size:13px">0.998</b></div>

    // ====== Render ======
    const render = {a:schemeA, b:schemeB, c:schemeC, d:schemeD, e:schemeE, f:schemeF}[key];
    document.getElementById('root').innerHTML = render();

    // ====== Charts ======
    function drawLineChart(id, color1, color2, dark) {
      const c = document.getElementById(id);
      if (!c) return;
      const dpr = devicePixelRatio || 1;
      const r = c.getBoundingClientRect();
      c.width = r.width * dpr;
      c.height = r.height * dpr;
      const x = c.getContext('2d');
      x.scale(dpr, dpr);
      const w = r.width, h = r.height;
      const p = {l:42, r:18, t:14, b:24};
      x.strokeStyle = dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.07)';
      x.lineWidth = 1;
      for (let i = 0; i <= 5; i++) {
        const y = p.t + (h - p.t - p.b) * i / 5;
        x.beginPath(); x.moveTo(p.l, y); x.lineTo(w - p.r, y); x.stroke();
      }
      for (let i = 0; i <= 8; i++) {
        const xx = p.l + (w - p.l - p.r) * i / 8;
        x.beginPath(); x.moveTo(xx, p.t); x.lineTo(xx, h - p.b); x.stroke();
      }
      const series = (vals, color, fill) => {
        x.strokeStyle = color; x.lineWidth = 2.2; x.beginPath();
        vals.forEach((v, i) => {
          const xx = p.l + (w - p.l - p.r) * i / (vals.length - 1);
          const yy = p.t + (h - p.t - p.b) * (1 - v);
          i ? x.lineTo(xx, yy) : x.moveTo(xx, yy);
        });
        x.stroke();
        if (fill) {
          x.lineTo(p.l + (w - p.l - p.r), h - p.b);
          x.lineTo(p.l, h - p.b);
          x.closePath();
          x.fillStyle = fill; x.fill();
        }
        vals.forEach((v, i) => {
          const xx = p.l + (w - p.l - p.r) * i / (vals.length - 1);
          const yy = p.t + (h - p.t - p.b) * (1 - v);
          x.fillStyle = color; x.beginPath(); x.arc(xx, yy, 3, 0, Math.PI * 2); x.fill();
        });
      };
      series([.24,.30,.37,.45,.53,.62,.72,.83,.94], color1, dark ? 'rgba(0,229,255,0.08)' : 'rgba(240,165,26,0.10)');
      series([.18,.22,.28,.36,.46,.57,.69,.82,.92], color2);
      x.fillStyle = dark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.4)';
      x.font = '9px Consolas';
      x.fillText('0%', 8, h - p.b + 3);
      x.fillText('100%', 8, p.t + 6);
    }

    function drawDualLine(id, dark) {
      const c = document.getElementById(id);
      if (!c) return;
      const dpr = devicePixelRatio || 1;
      const r = c.getBoundingClientRect();
      c.width = r.width * dpr; c.height = r.height * dpr;
      const x = c.getContext('2d'); x.scale(dpr, dpr);
      const w = r.width, h = r.height;
      const p = {l:38, r:14, t:12, b:22};
      x.strokeStyle = dark ? 'rgba(0,229,255,0.08)' : 'rgba(0,0,0,0.07)';
      x.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = p.t + (h - p.t - p.b) * i / 4;
        x.beginPath(); x.moveTo(p.l, y); x.lineTo(w - p.r, y); x.stroke();
      }
      for (let i = 0; i <= 6; i++) {
        const xx = p.l + (w - p.l - p.r) * i / 6;
        x.beginPath(); x.moveTo(xx, p.t); x.lineTo(xx, h - p.b); x.stroke();
      }
      const series = (vals, color) => {
        x.strokeStyle = color; x.lineWidth = 2;
        x.beginPath();
        vals.forEach((v, i) => {
          const xx = p.l + (w - p.l - p.r) * i / (vals.length - 1);
          const yy = p.t + (h - p.t - p.b) * (1 - v);
          i ? x.lineTo(xx, yy) : x.moveTo(xx, yy);
        });
        x.stroke();
      };
      series([.30,.40,.50,.58,.65,.72,.78,.84,.88], '#00e5ff');
      series([.20,.28,.38,.46,.54,.60,.66,.72,.78], '#ff2e7e');
    }

    requestAnimationFrame(() => {
      const dark = (key === 'a' || key === 'c' || key === 'e');
      const c1 = dark ? '#00e5ff' : (key === 'd' ? '#0d7a4f' : (key === 'f' ? '#e87a3a' : '#2b6cff'));
      const c2 = dark ? '#ff2e7e' : (key === 'd' ? '#a8651b' : (key === 'f' ? '#e8c03a' : '#18a957'));
      const map = {
        a: () => drawLineChart('chartA', c1, c2, true),
        b: () => drawLineChart('chartB', c1, c2, false),
        c: () => { drawLineChart('chartC1', c1, c2, true); drawDualLine('chartC2', true); },
        d: () => drawLineChart('chartD', c1, c2, false),
        e: () => drawLineChart('chartE', c1, c2, true),
        f: () => drawLineChart('chartF', c1, c2, false),
      };
      if (map[key]) map[key]();
    });
  </script>
